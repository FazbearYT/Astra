# ОПЦИОНАЛЬНО: обратный прокси Apache, чтобы QR вёл на чистый http://IP (без :8501).
# Файл кладётся в /etc/apache2/sites-available/astra.conf
#
# Перед включением активировать модули (один раз):
#   sudo a2enmod proxy proxy_http proxy_wstunnel rewrite
#   sudo a2dissite 000-default.conf
#   sudo a2ensite astra.conf
#   sudo systemctl restart apache2
#
# Streamlit держит постоянный WebSocket на /_stcore/stream — без proxy_wstunnel
# интерфейс загрузится, но останется "вечно крутиться". Блок ниже это решает.

<VirtualHost *:80>
    ServerAdmin webmaster@localhost

    # WebSocket Streamlit (должен идти ПЕРЕД обычным ProxyPass / )
    ProxyPass        /_stcore/stream ws://127.0.0.1:8501/_stcore/stream
    ProxyPassReverse /_stcore/stream ws://127.0.0.1:8501/_stcore/stream

    # Обычный HTTP-трафик
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8501/
    ProxyPassReverse / http://127.0.0.1:8501/

    ErrorLog  ${APACHE_LOG_DIR}/astra_error.log
    CustomLog ${APACHE_LOG_DIR}/astra_access.log combined
</VirtualHost>
